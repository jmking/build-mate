<div style="width: 460px; height: 530px; position: relative; overflow: hidden; background: radial-gradient(55% 70% at 8% 20%, #23417F 0%, rgba(35,65,127,0) 72%), radial-gradient(45% 55% at 92% 10%, #6B2A57 0%, rgba(107,42,87,0) 72%), radial-gradient(60% 65% at 72% 100%, #6E4318 0%, rgba(110,67,24,0) 72%), radial-gradient(45% 60% at 10% 98%, #1B5A4E 0%, rgba(27,90,78,0) 72%), #111528">
<div style="position: absolute; left: 60px; top: 40px; border-radius: 18px; box-shadow: 0 30px 80px rgba(20,30,70,0.32), 0 8px 24px rgba(20,30,70,0.16), 0 0 0 0.5px rgba(0,0,0,0.22)">

 1; min-height: 0; padding: 0 6px; display: flex; flex-direction: column; gap: 1px"><div style="padding: 4px 10px; font-size: 11px; font-weight: 600; color: #98989D">Needs you</div><button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span aria-hidden="true" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background: #BF5AF2"></span><span style="flex-grow: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Export reports as PDF</span><span style="font-size: 12px; color: #98989D; font-variant-numeric: tabular-nums">2 questions</span></button><button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span aria-hidden="true" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background: #BF5AF2"></span><span style="flex-grow: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Add retries to the S3 upload worker</span><span style="font-size: 12px; color: #98989D; font-variant-numeric: tabular-nums">Input</span></button><button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span aria-hidden="true" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background: #BF5AF2"></span><span style="flex-grow: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Redesign the empty state for projects</span><span style="font-size: 12px; color: #98989D; font-variant-numeric: tabular-nums">Approve plan</span></button><button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span aria-hidden="true" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background: #BF5AF2"></span><span style="flex-grow: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Show upload progress on attachments</span><span style="font-size: 12px; color: #98989D; font-variant-numeric: tabular-nums">1 question</span></button><button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span aria-hidden="true" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background: #30D158"></span><span style="flex-grow: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Rate-limit password reset emails</span><span style="font-size: 12px; color: #98989D; font-variant-numeric: tabular-nums">Human review</span></button><button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span aria-hidden="true" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background: #30D158"></span><span style="flex-grow: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Replace moment.js with date-fns</span><span style="font-size: 12px; color: #98989D; font-variant-numeric: tabular-nums">Human review</span></button><div style="padding: 12px 10px 4px; font-size: 11px; font-weight: 600; color: #98989D">Building</div><button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span aria-hidden="true" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background: #0A84FF"></span><span style="flex-grow: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Paginate the audit log endpoint</span><span style="font-size: 12px; color: #98989D; font-variant-numeric: tabular-nums">7/20</span></button><button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span aria-hidden="true" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background: #8E8E93"></span><span style="flex-grow: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Add dark-mode tokens to settings</span><span style="font-size: 12px; color: #98989D; font-variant-numeric: tabular-nums">Paused</span></button></div><div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; padding: 0 12px 0 16px; border-top: 0.5px solid rgba(255,255,255,0.12)"><span style="font-size: 12px; color: #98989D">3 in PR · 1 retrying</span><button style="margin-left: auto; height: 26px; padding: 0 12px; border-radius: 13px; font-size: 12px; background: rgba(62,62,66,0.84); backdrop-filter: blur(16px) saturate(180%); border: 0.5px solid rgba(255,255,255,0.12); box-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08)">Open Build Mate</button></div></div>
