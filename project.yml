name: BuildMate
options:
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: '-'
    ENABLE_APP_SANDBOX: NO
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
targets:
  BuildMate:
    type: application
    platform: macOS
    sources: [BuildMate]
    info:
      path: BuildMate/Info.plist
      properties:
        CFBundleName: Build Mate
        CFBundleDisplayName: Build Mate
        LSApplicationCategoryType: public.app-category.developer-tools
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buildmate.app
        PRODUCT_NAME: Build Mate
        EXECUTABLE_NAME: BuildMate
        ASSETCATALOG_COMPILER_APPICON_NAME: BuildMate
  BuildMateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BuildMateTests
        excludes: [Fixtures]
      - path: BuildMateTests/Fixtures
        type: folder
        buildPhase: resources
      - path: BuildMate/Core
      - path: BuildMate/UI/AppModel.swift
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buildmate.tests
        GENERATE_INFOPLIST_FILE: YES
  BuildMateUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: BuildMateUITests
      - path: BuildMate/Core
      - path: BuildMateTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: BuildMate
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buildmate.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BuildMate
schemes:
  BuildMate:
    build:
      targets:
        BuildMate: all
    test:
      targets: [BuildMateTests]
      gatherCoverageData: false
  BuildMateUI:
    build:
      targets:
        BuildMate: all
    test:
      targets: [BuildMateUITests]
      gatherCoverageData: false
